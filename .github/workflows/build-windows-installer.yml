
name: Build Backrooms Windows Launcher

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Installers
    runs-on: windows-latest

    steps:
      - name: Check out game
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Find game project
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter package.json -Recurse -File |
            Where-Object { $_.FullName -notmatch '[\\/](node_modules|\.git)[\\/]' }

          $game = $null

          foreach ($file in $files) {
            try {
              $pkg = Get-Content $file.FullName -Raw | ConvertFrom-Json
              if ($pkg.scripts -and $pkg.scripts.'dist:win') {
                $game = $file
                break
              }
            } catch {}
          }

          if (-not $game) {
            throw "No package.json with a dist:win script was found. Make sure you uploaded the complete Windows build kit."
          }

          "GAME_DIR=$($game.DirectoryName)" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          Write-Host "Game project found: $($game.DirectoryName)"

      - name: Install dependencies
        shell: pwsh
        run: |
          Set-Location $env:GAME_DIR
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installer and portable app
        shell: pwsh
        run: |
          Set-Location $env:GAME_DIR
          npm run dist:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows files
        uses: actions/upload-artifact@v7
        with:
          name: Backrooms-Nightmare-Protocol-Windows-Installers
          path: '**/release/*.exe'
          if-no-files-found: error
          retention-days: 30
